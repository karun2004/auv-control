<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUV SITL Results</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--mute:#667085;--line:#e2e5ea;--ok:#12805c;--bad:#c0392b;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1318;--card:#171c23;--fg:#e6e9ee;--mute:#8b95a5;--line:#262d37;--ok:#3ecf9a;--bad:#ff6b5b;--warn:#f0b955}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
header{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
h1{font-size:18px;margin:0}
.sub{color:var(--mute)}
main{padding:16px;max-width:1200px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile b{display:block;font-size:22px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}tbody tr:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.wrap{overflow-x:auto}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}.warn{color:var(--warn)}
#detail{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;display:none}
#detail img{max-width:100%;height:auto;border-radius:4px}
#detail h2{font-size:15px;margin:0 0 8px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px;margin:8px 0}
.kv span{color:var(--mute)}
#err{color:var(--bad);padding:0 0 12px}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
</style>
</head>

  if(!res){el.innerHTML='<span class="sub">No replay report yet.</span>';return}
  const d=res.data;
  const rows=Array.isArray(d)?d:(d.logs||Object.entries(d).map(([k,v])=>({file:k,...(typeof v==='object'?v:{value:v})})));
  if(!rows.length||typeof rows[0]!=='object'){el.innerHTML='<pre>'+JSON.stringify(d,null,1)+'</pre>';return}
  const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(k=>typeof rows.find(r=>r[k]!=null)?.[k]!=='object');
  el.innerHTML='<table><thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+cols.map(c=>`<td>${typeof r[c]==='number'?f(r[c],3):(r[c]??'-')}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
}
document.getElementById('reload').onclick=load;
load();
</script>
</body>
</html>
